<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Meus favoritos | MasterCine</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/favoritos.css">
  <script src="js/favoritos.js" defer></script>
</head>
<body>
  <div class="container-principal">
    <header class="header cabecalho">
      <a class="logo logo-link cabecalho__logo" href="index.html">MASTERCINE</a>
      <nav class="header-navegacao cabecalho__navegacao" aria-label="Navegação principal">
        <ul class="header-menu cabecalho__menu">
          <li class="header-item cabecalho__item"><a class="cabecalho__link" href="index.html" aria-label="Início"><i class="fa-solid fa-house"></i></a></li>
          <li class="header-item cabecalho__item"><a class="cabecalho__link" href="pesquisa.html" aria-label="Pesquisar"><i class="fa-solid fa-magnifying-glass"></i></a></li>

      <section id="favoritos-lista" class="favoritos-grid favoritos__grade" aria-label="Lista de filmes e séries favoritos" aria-live="polite"></section>
